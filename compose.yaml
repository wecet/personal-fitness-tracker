services:
  # Joins your tailnet as "ember" and serves the app over HTTPS at
  # https://ember.<your-tailnet>.ts.net — only reachable by your own devices.
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ember
    environment:
      - TS_HOSTNAME=ember
      - TS_AUTHKEY=${TS_AUTHKEY:?Set TS_AUTHKEY in .env}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    ports:
      - "127.0.0.1:3000:3000" # local access on the host machine too
    restart: unless-stopped

  app:
    build: .
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  tailscale-state:
  app-data:
