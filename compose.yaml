services:
  # Joins your tailnet as "ember" (the app's original name; kept so the URL
  # stays the same) and serves the app over HTTPS at
  # https://ember.<your-tailnet>.ts.net — only reachable by your own devices.
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ember
    environment:
      - TS_HOSTNAME=ember
      - TS_AUTHKEY=${TS_AUTHKEY:?Set TS_AUTHKEY in .env}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    ports:
      - "127.0.0.1:3000:3000" # local access on the host machine too
    restart: unless-stopped

  app:
    build: .
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      - BACKUP_DIR=/backups
      # Reset links point here. Password-reset email goes out through Gmail when
      # SMTP_USER and SMTP_PASS are set (see .env.example); otherwise the link is
      # written to this container's log.
      - APP_URL=${APP_URL:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
    volumes:
      - app-data:/data
      # Daily database copies (last 30), outside the Docker volume. Point
      # BACKUP_HOST_DIR in .env at a synced folder, e.g. iCloud Drive.
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    restart: unless-stopped

volumes:
  tailscale-state:
  app-data:
