<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#2a2c31"/>
      <stop offset="1" stop-color="#16171a"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#ff6f61" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff6f61" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bell" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffa08f"/>
      <stop offset="0.5" stop-color="#ff6f61"/>
      <stop offset="1" stop-color="#d9473c"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c31"/>
      <stop offset="1" stop-color="#16171a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="310" r="210" fill="url(#glow)"/>
  <!-- flaring handle, wider than where it meets the bell -->
  <path d="M168 270 C140 214 150 124 256 124 C362 124 372 214 344 270" fill="none" stroke="url(#bell)" stroke-width="40" stroke-linecap="round"/>
  <!-- round bell with a flat base -->
  <path d="M184 412 A128 128 0 1 1 328 412 Z" fill="url(#bell)" stroke="#1d1e22" stroke-width="10" paint-order="stroke"/>
  <!-- highlight -->
  <path d="M162 262 C176 228 204 206 236 198" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>
  <!-- ember flame cut into the bell -->
  <g transform="translate(172 246) scale(7)">
    <path d="M12 2c1 3.6 5 6.1 5 11.2A5 5 0 0 1 7 13.4c0-2.6 1.3-4.4 2.6-5.6.2 1.9 1 3.1 2.3 3.6C11.2 8.6 11 5.2 12 2z" fill="url(#flame)"/>
  </g>
</svg>
