<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#2a2c31"/>
      <stop offset="1" stop-color="#16171a"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.62" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#ff6f61" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff6f61" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa08f"/>
      <stop offset="0.5" stop-color="#ff6f61"/>
      <stop offset="1" stop-color="#d9473c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="300" cy="300" r="220" fill="url(#glow)"/>
  <!-- tempo: rising load, building to full heat -->
  <rect x="100" y="272" width="80" height="140" rx="40" fill="url(#bar)" opacity="0.4"/>
  <rect x="216" y="192" width="80" height="220" rx="40" fill="url(#bar)" opacity="0.7"/>
  <rect x="332" y="100" width="80" height="312" rx="40" fill="url(#bar)"/>
  <!-- highlight on the tallest bar -->
  <path d="M352 150 L352 220" stroke="#fff" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>
</svg>
